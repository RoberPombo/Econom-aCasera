version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    # Never open a PR for a version published less than 7 days ago, so a
    # compromised or immediately yanked release does not reach the repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      tauri:
        patterns:
          - "@tauri-apps/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
    # vitest 5 and jsdom 31 break the test environment (URL.createObjectURL and
    # the file `_buffer` used when attaching receipts), so major bumps of these
    # are upgraded by hand once the tests are adapted.
    ignore:
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    # Never open a PR for a version published less than 7 days ago, so a
    # compromised or immediately yanked release does not reach the repo.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      tauri-crate:
        patterns:
          - "tauri*"

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
